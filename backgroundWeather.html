<!-----------------------------------------WEATHER BACKGROUND------------------------------------------------------->
    <div id="sky-container">
        <!-- Isolated backgrounds -->
        <div id="bg-day-sunny" class="sky-layer"></div>
        <div id="bg-night-sunny" class="sky-layer"></div>
        <div id="bg-day-cloudy" class="sky-layer"></div>
        <div id="bg-night-cloudy" class="sky-layer"></div>
        <div id="bg-day-rainy" class="sky-layer"></div>
        <div id="bg-night-rainy" class="sky-layer"></div>
        <div id="bg-day-snowy" class="sky-layer"></div>
        <div id="bg-night-snowy" class="sky-layer"></div>
        <div id="bg-day-windy" class="sky-layer"></div>
        <div id="bg-night-windy" class="sky-layer"></div>
    </div>

    <!-- Celestials Layer -->
    <div id="celestials">
        <div id="sun" class="celestial-body"></div>
        <div id="moon" class="celestial-body">
            <div class="crater crater-1"></div>
            <div class="crater crater-2"></div>
            <div class="crater crater-3"></div>
        </div>
    </div>
            
    <!-- Particle Engine Canvas -->
    <canvas id="weather-canvas"></canvas>
